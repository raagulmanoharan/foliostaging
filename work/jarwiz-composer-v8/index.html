</style></head><body><main><a href="../../case-studies/jarwiz/" id="back">← Jarwiz case study</a><h1>A tighter composer.</h1><p>Compact spacing, a softer placeholder, and a Stop button that cancels generation.</p><figure><figcaption>Click, type, generate, stop.</figcaption><video id="motion" width="560" height="118" src="interaction-tight.mp4" poster="ready.png" autoplay muted loop playsinline preload="auto" aria-label="The cursor clicks the composer, types a question and clicks Send. The send button expands to a Stop button. Clicking Stop cancels the request and returns it to an arrow."></video></figure><section aria-label="Composer states"><figure><figcaption>Empty</figcaption><img src="empty.png" width="1120" height="236" alt="Compact composer with aligned attachment and send controls."></figure><figure><figcaption>Ready to send</figcaption><img src="ready.png" width="1120" height="236" alt="The composer holding a short Kyoto planning question."></figure><figure><figcaption>Generating</figcaption><img src="generating.png" width="1120" height="236" alt="An expanded Stop button with a square icon and a soft glow around the composer."></figure></section><footer>Captured from the product. This is a composer review before the next full demo cut.</footer></main><script>const movie=document.querySelector('#motion'),reduce=matchMedia('(prefers-reduced-motion:reduce)');function sync(){if(reduce.matches){movie.pause();movie.currentTime=0;movie.removeAttribute('autoplay')}else movie.play().catch(()=>{})}reduce.addEventListener('change',sync);sync();</script></body></html>
