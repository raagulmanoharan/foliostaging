<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Jarwiz · Context interaction</title><style>
@font-face{font-family:Neue;src:url('/foliostaging/assets/NeueMontreal-Regular-CxM6MvLr.otf') format('opentype');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#161616;color:#ededed;font:16px/1.5 Neue,Arial,sans-serif;-webkit-font-smoothing:antialiased}main{max-width:1184px;margin:auto;padding:40px 24px 32px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:0 0 24px}h1{font-size:24px;font-weight:400;margin:0 0 4px;letter-spacing:-.02em}p{color:#929292;font-size:14px;margin:0}button{font:inherit;font-size:14px;border:1px solid #ffffff25;border-radius:10px;padding:10px 16px;background:#ededed;color:#151515;cursor:pointer;white-space:nowrap}button:disabled{opacity:.45;cursor:default}.frame{padding:32px;background:#63331e url('./backdrop.webp') center/cover;border-radius:28px}.browser{overflow:hidden;border-radius:14px;background:#090a0c;box-shadow:0 15px 50px #0004}.chrome{display:flex;gap:7px;align-items:center;height:28px;padding-left:15px;background:#1b1c1e;border-bottom:1px solid #ffffff0a}.chrome i{width:8px;height:8px;border-radius:50%;background:#ff6058}.chrome i:nth-child(2){background:#febd2e}.chrome i:nth-child(3){background:#28c840}.screen{position:relative;aspect-ratio:8/5;overflow:hidden}.screen img{position:absolute;inset:0;width:100%;height:100%}iframe{position:absolute;inset:0;width:1280px;height:800px;border:0;transform-origin:0 0;opacity:0;transition:opacity 180ms ease}.ready iframe{opacity:1}footer{display:flex;justify-content:space-between;gap:24px;padding-top:20px}footer p{font-size:13px}footer a{color:#b4b4b4;white-space:nowrap;text-underline-offset:3px}.status{color:#b4b4b4;min-width:80px;text-align:right}@media(max-width:600px){main{padding:24px 16px}.frame{padding:14px;border-radius:20px}header{align-items:start;gap:12px}h1{font-size:20px}p{font-size:13px}button{padding:9px 12px;font-size:13px}footer{display:block}footer .status{text-align:left;margin-top:8px}}@media(prefers-reduced-motion:reduce){iframe{transition:none}}
</style></head><body><main><header><div><h1>The board is the context.</h1><p>Preview the feedback when Jarwiz reads what is already on the canvas.</p></div><button id="replay" disabled>Loading preview</button></header><div class="frame"><div class="browser"><div class="chrome" aria-hidden="true"><i></i><i></i><i></i></div><div class="screen"><img src="./board.webp" alt="A Kyoto trip board, ready for a follow-up question"><iframe src="./product/?v=soft-bloom-2" title="Jarwiz context interaction prototype"></iframe></div></div></div><footer><p>Click Send in the composer, or replay the interaction. This preview shows the feedback only. <a href="./product/?v=soft-bloom-2" target="_blank" rel="noopener">Open full screen ↗</a></p><p class="status" role="status">Loading</p></footer></main><script>
const screen=document.querySelector('.screen'),frame=document.querySelector('iframe'),button=document.querySelector('#replay'),status=document.querySelector('.status');const resize=()=>frame.style.transform=`scale(${screen.clientWidth/1280})`;new ResizeObserver(resize).observe(screen);resize();button.addEventListener('click',()=>frame.contentWindow.postMessage({type:'context-preview:play'},location.origin));window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;if(e.data.type==='context-preview:ready'){screen.classList.add('ready');button.disabled=false;button.textContent='Replay interaction';status.textContent='Ready';}if(e.data.type==='context-preview:reading'){button.disabled=true;button.textContent='Reading the board';status.textContent='Context in use';}if(e.data.type==='context-preview:idle'){button.disabled=false;button.textContent='Replay interaction';status.textContent='Ready';}});
</script></body></html>
