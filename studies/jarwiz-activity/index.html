<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Jarwiz · Activity review</title><link rel="icon" href="data:,"><link rel="stylesheet" href="review.css?v=audit2">
</head>
<body>
<main>
<header class="review-head"><h1>Agent activity</h1><span>Prototype</span></header>
<p class="guide">Select the sketch and the notes, then send the suggested request. Follow Jarwiz’s work in Activity.</p>
<div class="stage"><section class="window" aria-label="Jarwiz board">
<div class="chrome" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="workspace">
<section class="canvas" aria-label="Board canvas">
<div class="boardbar"><span class="mark">✦</span><span class="slash">/</span>Signup exploration <button class="panel-toggle" aria-label="Open side panel">Activity ›</button></div>
<div class="cards">
<button class="card source" data-card="sketch" aria-pressed="false"><small>Sketch</small><h2>First-run signup</h2><img class="sketch" src="../jarwiz-agent-team/film/assets/sketch.webp" alt="Pencil sketch of the signup screen"></button>
<button class="card source" data-card="notes" aria-pressed="false"><small>Research notes</small><h2>Trying the product</h2><p>People paused at “Connect a workspace” before they had seen a report.</p><blockquote>“Can I see what I’m connecting this for?”</blockquote></button>
<article class="card result" tabindex="-1" hidden></article></div>
<div class="composer"><div class="chips"></div><div class="compose-line"><label class="sr" for="prompt">Prompt for Jarwiz</label><textarea rows="1" id="prompt" placeholder="Ask about this board"></textarea><button class="send" aria-label="Send prompt">↑</button></div></div>
</section>
<aside aria-label="Board side panel"><div class="rail-head"><button id="activity">Activity</button><button id="comments">Comments</button><button class="close" aria-label="Collapse side panel">›</button></div><div class="rail"><div id="feed" aria-label="Board activity history"></div><div id="thread" hidden></div></div><button class="latest" hidden>See latest activity ↓</button></aside>
</div></section></div>
<p class="foot">Illustrative board. Requests, changes, and rollbacks stay in this tab when you refresh.</p><div class="sr" role="status" id="status"></div>
</main><dialog id="preview" aria-labelledby="dialog-title" aria-describedby="dialog-copy"><h2 id="dialog-title">Roll back this change?</h2><p id="dialog-copy"></p><div class="diff"></div><div class="dialog-actions"><button id="cancel" autofocus>Cancel</button><button id="confirm">Roll back change</button></div></dialog><script src="review.js?v=audit2"></script>
</body></html>
